[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laminectomy"
version = "0.1.0"
description = "Extract Spine rigs from Unity projects and built games, then view them in a browser."
requires-python = ">=3.11"
dependencies = [
    "UnityPy>=1.25",
    "Pillow>=10",
    "numpy>=1.26",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
laminectomy = "laminectomy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laminectomy = ["web/*.html"]
